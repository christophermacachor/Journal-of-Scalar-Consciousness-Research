name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 743b8c88ff9d9d1a45b1d7a09cf786d0
          projectName: journal-of-scalar-consciousness-research
          directory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
